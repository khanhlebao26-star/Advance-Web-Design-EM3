<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">WOMEN'S PRODUCTS</a>

        <ul class="nav-links">
            <li><a href="#">All</a></li>
            <li><a href="#">Clothings</a></li>
            <li><a href="#">Bags</a></li>
            <li><a href="#">Shoes</a></li>
            <li><a href="#">Watches</a></li>
            <li><a href="#">Googles</a></li>
        </ul>
    </nav>

    <main class="content">

        <!-- Left side -->
        <section class="left-content">

            <div class="product-card">
                <img src="public/images/product_left_1.png" alt="Women Bags">
                <h3 style="color: red; text-align: center;">Women Bags</h3>
                <p class="price">€100.00</p>
                <p class="old-price"><del>€50.00</del></p>

                <button class="cart-button">ADD TO CART</button>
            </div>

            <div class="product-card">
                <img src="public/images/product_left_2.png" alt="Google">
                <h3 style="color: red;">Google</h3>
                <p class="price">€25.00</p>
                <button class="cart-button">ADD TO CART</button>
            </div>

        </section>

        <!-- Right side -->
        <section class="right-content">
            <div class="product-right">

                <img src="public/images/product_right.png" alt="For Women">

                <div class="overlay"></div>
                <div class="banner">
                    <h2>FOR WOMEN</h2>
                    <button class="view-button">VIEW ALL</button>
                </div>

            </div>
        </section>

    </main>

</body>
</html>
