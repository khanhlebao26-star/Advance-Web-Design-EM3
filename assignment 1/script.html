<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .red {
        width: 50px;
        height: 50px;
        background-color: red;
        margin:10px;
        display: inline-block;
    }

    .grey {
        width: 50px;
        height: 50px;
        background-color: grey;
        margin:10px;
        display: inline-block;
    }

</style>
<body>
    <p id="hinhvuong"></p>
    <script>
        for (let i = 0; i <5; i++) {
            for (let j = 0; j <10; j++) {
                if (i % 2 == 0) {
                    document.write('<div class="grey"></div>');
                } else {
                    document.write('<div class="red"></div>');
                }
            }
            document.write("<br>");
        }

    </script>
</body>
</html>
