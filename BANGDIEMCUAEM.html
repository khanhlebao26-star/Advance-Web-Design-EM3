<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm của em</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to right,
                #dceaff,
                white 15%,
                white 85%,
                #dceaff
            );
            min-height: 100vh;
        }

        .container {
            width: 820px;
            margin: 85px auto 0;
            padding: 10px 40px 30px;
            background-color: #aaa;
            border: 2px solid #d33;
            min-height: 490px;
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            color: #2864c7;
            font-size: 42px;
            font-weight: bold;
        }

        .row {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }

        .row label {
            width: 135px;
            font-size: 24px;
            color: #333;
        }

        .row input,
        .row select {
            height: 46px;
            border: none;
            background-color: #f8f8f8;
            font-size: 22px;
            padding: 5px;
        }

        .row input {
            flex: 1;
        }

        .row select {
            width: 80px;
            color: red;
        }

        #summary {
            color: #333;
        }

        #result {
            margin-top: 28px;
            margin-left: 0;
            height: 65px;
            font-size: 42px;
            color: red;
        }


        .buttons {
            display: flex;
            justify-content: center;
            gap: 75px;
            margin-top: 20px;
        }

        button {
            width: 65px;
            height: 48px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>BANG DIEM CUA EM</h1>

        <div class="row">
            <label>Semester 1:</label>
            <input type="number" id="semester1" min="0" max="10" step="1">
        </div>

        <div class="row">
            <label>Semester 2:</label>
            <input type="number" id="semester2" min="0" max="10" step="1">
        </div>

        <div class="row">
            <label>Year:</label>
            <select id="year">
                <option>1</option>
                <option>2</option>
            </select>
        </div>

        <div class="row">
            <label>Summarise:</label>
            <input type="text" id="summary" readonly>
        </div>

        <div id="result"></div>

        <div class="buttons">
            <button onclick="calculate()">OK</button>
            <button onclick="cancelForm()">Cancel</button>
        </div>

    </div>

    <script>
        function calculate() {
            var a = Number(document.getElementById("semester1").value);
            var b = Number(document.getElementById("semester2").value);
            var c = document.getElementById("year").value;

            const average1 = (a + b) / 2;
            const average2 = (a + (b * 2)) / 3;

            let average;

            if (c == "1") {
                average = average1;
            } else if (c == "2") {
                average = average2;
            }

            document.getElementById("summary").value = average.toFixed(2);

            if (average >= 9) {
                document.getElementById("result").textContent = "Học sinh giỏi";
                document.getElementById("result").style.color = "red";
            } else if (average < 9) {
                document.getElementById("result").textContent = "Học sinh khá";
                document.getElementById("result").style.color = "black";
            }
        }

        function cancelForm() {
            document.getElementById("semester1").value = "";
            document.getElementById("semester2").value = "";
            document.getElementById("year").value = "1";
            document.getElementById("summary").value = "";
            document.getElementById("result").textContent = "";
        }

        calculate();
    </script>

</body>
</html>
